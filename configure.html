<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bar Chart — Format</title>
    <link rel="stylesheet" href="./fonts/fonts.css?v=22ceb76171" />
    <link rel="stylesheet" href="./configure.css?v=523118c31a" />
  </head>

  <body>
    <nav class="tabs" id="tabs" role="tablist"></nav>

    <main class="body" id="panels"></main>

    <footer class="footer">
      <button class="btn" id="reset-tab" type="button" title="Restore the defaults for this tab">Reset tab</button>
      <span class="status" id="status"></span>
      <button class="btn" id="cancel" type="button">Cancel</button>
      <button class="btn btn--primary" id="done" type="button">Done</button>
    </footer>

    <script src="./icons.js?v=58c76ce58f"></script>
    <script src="./config.js?v=d696c33a5d"></script>
    <script src="./configure.js?v=cfe853579b"></script>
    <script>
      if (/[?&]mock\b/.test(location.search)) document.write('<script src="./dev/mock.js?v=de91f06201"><\/script>');
    </script>
    <script>
      // Tableau Extensions API is bundled in ./lib (no CDN). Skipped when a dev mock already defined it.
      if (!(window.tableau && window.tableau.extensions)) {
        document.write('<script src="./lib/tableau.extensions.1.17.0.min.js?v=276479f2c7"><\/script>');
      }
    </script>
    <script>
      if (window.tableau && window.tableau.extensions) {
        window.BarChartConfigure.init();
      } else {
        console.error('Could not load the Tableau Extensions API library.');
      }
    </script>
  </body>
</html>
