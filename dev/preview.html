<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bar Chart — dev preview</title>
<style>
  body { margin: 0; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, Arial, sans-serif; color: #263244; background: #eef0f2; }
  .bar { display: flex; gap: 14px; align-items: center; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e2e4e8; flex-wrap: wrap; }
  .bar b { font-size: 14px; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  .zone { resize: both; overflow: hidden; width: 900px; height: 500px; background: #fff; border: 1px solid #d5d9df; }
  .zone iframe, .dlg iframe { width: 100%; height: 100%; border: 0; display: block; }
  .dlg { width: 620px; height: 780px; background: #fff; border: 1px solid #d5d9df; box-shadow: 0 6px 24px rgba(0,0,0,.12); display: none; }
  button, select { font: inherit; padding: 4px 10px; }
  .note { color: #68707d; }
</style>
</head>
<body>
  <div class="bar">
    <b>Bar Chart — dev preview</b>
    <label>Sample data
      <select id="ds">
        <option value="sales">Sub-Category › Region › Segment (line, target)</option>
        <option value="monthly">Monthly (date axis + line)</option>
        <option value="compare">Two measures (left-right comparison)</option>
        <option value="grouped">Three measures (grouped)</option>
        <option value="stacked">Three measures (stacked / 100%)</option>
        <option value="progress">Ratios with goal (progress bars)</option>
        <option value="negative">Negative values</option>
        <option value="nested">Category › Sub-Category, Sales + Profit</option>
        <option value="raw">Raw large numbers</option>
        <option value="measures">No Dimension: Measure Names</option>
        <option value="top">25 countries (Top N)</option>
      </select>
    </label>
    <label><input type="checkbox" id="rename"> Rename first Dimension pill</label>
    <button id="fmt" type="button">Format Extension</button>
    <button id="reset" type="button">Reset settings</button>
    <span class="note">Right-click a bar for the menu, double-click to drill down. Drag the zone's corner to resize.</span>
  </div>
  <div class="wrap">
    <div class="zone"><iframe id="card" title="chart"></iframe></div>
    <div class="dlg" id="dlg"><iframe id="dialog" title="Format dialog"></iframe></div>
  </div>
<script>
  var ds = document.getElementById('ds');
  ds.value = localStorage.getItem('bcMockData') || 'sales';
  var rn = document.getElementById('rename');
  rn.checked = localStorage.getItem('bcMockRename') === '1';
  rn.addEventListener('change', function () { localStorage.setItem('bcMockRename', rn.checked ? '1' : '0'); closeDlg(); load(); });
  function load () { document.getElementById('card').src = '../index.html?mock&data=' + ds.value + (rn.checked ? '&rename' : '') + (/debug/.test(location.search) ? '&debug' : ''); }
  ds.addEventListener('change', function () { localStorage.setItem('bcMockData', ds.value); closeDlg(); load(); });
  document.getElementById('reset').addEventListener('click', function () { localStorage.removeItem('bcMockSettings'); closeDlg(); load(); });
  document.getElementById('fmt').addEventListener('click', function () {
    document.getElementById('card').contentWindow.postMessage({ type: 'bc-configure' }, '*');
  });
  function closeDlg () {
    document.getElementById('dlg').style.display = 'none';
    document.getElementById('dialog').src = 'about:blank';
    var c = document.getElementById('card').contentWindow;
    if (c) c.postMessage({ type: 'bc-dialog-closed' }, '*');
  }
  window.addEventListener('message', function (e) {
    if (!e.data) return;
    if (e.data.type === 'bc-open-dialog') {
      document.getElementById('dlg').style.display = 'block';
      document.getElementById('dialog').src = e.data.url;
    }
    if (e.data.type === 'bc-close-dialog') closeDlg();
  });
  load();
</script>
</body>
</html>
